<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AreYouIoT — Smart Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #030d07;
  --bg2:       #071410;
  --panel:     #0b1f17;
  --panel2:    #0f2820;
  --border:    #1a4030;
  --border2:   #0d2e20;
  --accent:    #00ff88;
  --accent2:   #00cc66;
  --accent3:   #00ff44;
  --dim:       #1a5c3a;
  --text:      #c8f0dc;
  --text2:     #7ab898;
  --text3:     #3d7a58;
  --warn:      #ffaa00;
  --danger:    #ff4444;
  --info:      #00aaff;
  --fan-c:     #00ccff;
  --heat-c:    #ff6633;
  --led-c:     #ffee55;
  --pump-c:    #44aaff;
  --mono:      'Share Tech Mono', monospace;
  --sans:      'Noto Sans KR', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── CANVAS BACKGROUND ── */
#bg-canvas {
  position: fixed; inset: 0;
  z-index: 0;
  opacity: 0.35;
  pointer-events: none;
}

/* ── LAYOUT ── */
.app {
  position: relative;
  z-index: 1;
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 24px 48px;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
  gap: 16px;
  flex-wrap: wrap;
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-icon {
  width: 42px; height: 42px;
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 0 12px rgba(0,255,136,0.3);
  background: rgba(0,255,136,0.05);
  flex-shrink: 0;
}

.logo-text {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  line-height: 1.6;
}

.logo-text strong {
  display: block;
  font-family: var(--mono);
  font-size: 18px;
  color: var(--accent);
  letter-spacing: 0.05em;
  text-shadow: 0 0 20px rgba(0,255,136,0.5);
}

.header-status {
  display: flex;
  align-items: center;
  gap: 20px;
}

#firebase-status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.08em;
}

#firebase-status .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text3);
  transition: background 0.3s, box-shadow 0.3s;
}

#firebase-status.connected .dot {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: pulse 2s infinite;
}

#firebase-status.error .dot { background: var(--danger); }

@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

.ts-badge {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  letter-spacing: 0.05em;
}

/* ── MODULE TABS ── */
.module-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}

.tab-btn {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--text3);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 8px 20px 10px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
  position: relative;
  top: 1px;
}

.tab-btn:hover { color: var(--text2); }

.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  text-shadow: 0 0 12px rgba(0,255,136,0.4);
}

.tab-btn .tab-status {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text3);
  margin-left: 7px;
  vertical-align: middle;
  position: relative;
  top: -1px;
}

.tab-btn .tab-status.online {
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: pulse 2s infinite;
}

/* ── MODULE PANEL ── */
.module-view { display: none; }
.module-view.active { display: block; }

/* ── TOP ROW ── */
.top-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  margin-bottom: 20px;
  align-items: start;
}

/* ── SENSORS GRID ── */
.sensors-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

@media (max-width: 900px) {
  .sensors-grid { grid-template-columns: repeat(2, 1fr); }
  .top-row { grid-template-columns: 1fr; }
}

@media (max-width: 520px) {
  .sensors-grid { grid-template-columns: 1fr 1fr; }
}

/* ── SENSOR CARD ── */
.sensor-card {
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 16px 18px 14px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}

.sensor-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-color, var(--accent)), transparent);
  opacity: 0.6;
}

.sensor-card:hover { border-color: var(--border); }

.sensor-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sensor-label .s-icon { font-size: 13px; }

.sensor-value {
  font-family: var(--mono);
  font-size: 32px;
  font-weight: 400;
  color: var(--accent);
  line-height: 1;
  transition: color 0.4s;
}

.sensor-value .unit {
  font-size: 14px;
  color: var(--text3);
  margin-left: 3px;
}

.sensor-bar {
  margin-top: 10px;
  height: 3px;
  background: var(--border2);
  border-radius: 2px;
  overflow: hidden;
}

.sensor-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--accent);
  transition: width 0.6s ease;
  box-shadow: 0 0 6px var(--accent);
}

.sensor-range {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text3);
}

/* ── AUTO MODE TOGGLE ── */
.auto-panel {
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 16px 20px;
  min-width: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.auto-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--text3);
  text-transform: uppercase;
  text-align: center;
}

.toggle-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.toggle {
  position: relative;
  width: 52px; height: 28px;
  cursor: pointer;
}

.toggle input { display: none; }

.toggle-track {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: var(--border);
  border: 1px solid var(--border);
  transition: background 0.3s, box-shadow 0.3s;
}

.toggle input:checked + .toggle-track {
  background: rgba(0,255,136,0.15);
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(0,255,136,0.3);
}

.toggle-thumb {
  position: absolute;
  top: 4px; left: 4px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--text3);
  transition: transform 0.25s, background 0.3s;
}

.toggle input:checked ~ .toggle-thumb {
  transform: translateX(24px);
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.toggle-state {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text3);
  transition: color 0.3s;
}

.toggle-state.on { color: var(--accent); text-shadow: 0 0 10px rgba(0,255,136,0.5); }

/* ── BOTTOM GRID ── */
.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 16px;
}

@media (max-width: 800px) {
  .bottom-grid { grid-template-columns: 1fr; }
}

/* ── ACTUATORS PANEL ── */
.panel {
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 18px 20px;
}

.panel-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border2);
}

/* ── ACTUATOR ROWS ── */
.actuator-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border2);
}

.actuator-row:last-child { border-bottom: none; }

.act-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 16px;
  background: var(--border2);
  border: 1px solid var(--border2);
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
  flex-shrink: 0;
}

.act-icon.active {
  background: rgba(0,255,136,0.08);
  border-color: var(--act-color, var(--accent));
  box-shadow: 0 0 10px rgba(0,255,136,0.2);
}

.act-info {
  flex: 1;
  min-width: 0;
}

.act-name {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--text2);
  margin-bottom: 3px;
}

.act-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
}

/* slider */
.act-slider-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}

.act-slider {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
}

.act-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  cursor: pointer;
}

.act-slider-val {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  min-width: 32px;
  text-align: right;
}

/* ── RULES PANEL ── */
.rules-grid {
  display: grid;
  gap: 10px;
}

.rule-row {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 12px 14px;
}

.rule-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.rule-name {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text2);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}

.rule-enabled-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.rule-chk { display: none; }

.rule-chk-track {
  width: 32px; height: 18px;
  border-radius: 9px;
  background: var(--border);
  border: 1px solid var(--border);
  position: relative;
  transition: background 0.25s, border-color 0.25s;
}

.rule-chk:checked + .rule-chk-track {
  background: rgba(0,255,136,0.12);
  border-color: var(--accent);
}

.rule-chk-thumb {
  position: absolute;
  top: 2px; left: 2px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--text3);
  transition: transform 0.2s, background 0.2s;
}

.rule-chk:checked ~ .rule-chk-thumb {
  transform: translateX(14px);
  background: var(--accent);
}

.rule-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

.rule-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rule-field label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--text3);
  text-transform: uppercase;
}

.rule-field input {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 13px;
  padding: 6px 8px;
  width: 100%;
  outline: none;
  transition: border-color 0.2s;
}

.rule-field input:focus { border-color: var(--accent2); }

.rule-save-btn {
  margin-top: 12px;
  width: 100%;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(0,255,136,0.06);
  border: 1px solid var(--accent2);
  border-radius: 5px;
  padding: 8px;
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s;
}

.rule-save-btn:hover {
  background: rgba(0,255,136,0.12);
  box-shadow: 0 0 10px rgba(0,255,136,0.2);
}

.rule-save-btn:active { transform: scale(0.98); }

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 9999;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  background: var(--panel2);
  border: 1px solid var(--accent2);
  border-radius: 7px;
  padding: 10px 18px;
  color: var(--accent);
  box-shadow: 0 0 20px rgba(0,255,136,0.2);
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
}

#toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* ── SCAN ANIMATION ── */
@keyframes scanline {
  0%   { top: -4px; }
  100% { top: 100%; }
}

.scan-wrap {
  position: relative;
  overflow: hidden;
}

.scanline {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0,255,136,0.15), transparent);
  animation: scanline 6s linear infinite;
  pointer-events: none;
  z-index: 2;
}

/* ── STATUS indicator ── */
.module-status-badge {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--text3);
  background: var(--bg2);
}

.module-status-badge.online {
  border-color: var(--accent2);
  color: var(--accent);
  background: rgba(0,255,136,0.07);
}

.module-status-badge.offline {
  border-color: #3d1010;
  color: var(--danger);
  background: rgba(255,50,50,0.05);
}

/* ── Module header row ── */
.module-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border2);
}

.module-name {
  font-family: var(--mono);
  font-size: 16px;
  color: var(--text);
  letter-spacing: 0.04em;
}

.module-fw {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  margin-left: auto;
}

.module-updated {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
}

/* ── CONFIG modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px 30px;
  width: min(480px, 94vw);
  box-shadow: 0 0 60px rgba(0,255,136,0.08);
}

.modal-title {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.12em;
  color: var(--accent);
  margin-bottom: 20px;
  text-transform: uppercase;
}

.modal-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.modal-field label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text3);
  text-transform: uppercase;
}

.modal-field input {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.2s;
}

.modal-field input:focus { border-color: var(--accent2); }

.modal-note {
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 20px;
  line-height: 1.6;
  border-left: 2px solid var(--border);
  padding-left: 12px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.btn {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 9px 18px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}

.btn-ghost {
  background: none;
  border: 1px solid var(--border);
  color: var(--text3);
}

.btn-ghost:hover { border-color: var(--text3); color: var(--text); }

.btn-primary {
  background: rgba(0,255,136,0.1);
  border: 1px solid var(--accent2);
  color: var(--accent);
}

.btn-primary:hover {
  background: rgba(0,255,136,0.18);
  box-shadow: 0 0 14px rgba(0,255,136,0.2);
}

.cfg-btn {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 7px 14px;
  border-radius: 5px;
  cursor: pointer;
  background: none;
  border: 1px solid var(--border);
  color: var(--text3);
  transition: all 0.2s;
}

.cfg-btn:hover { border-color: var(--accent2); color: var(--accent); }

/* scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* not-configured banner */
.not-configured {
  text-align: center;
  padding: 60px 20px;
  font-family: var(--mono);
  color: var(--text3);
  font-size: 13px;
  line-height: 2;
}

.not-configured .big {
  font-size: 32px;
  margin-bottom: 10px;
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- CONFIG MODAL -->
<div class="modal-overlay" id="cfg-modal">
  <div class="modal">
    <div class="modal-title">🔧 Firebase 설정</div>
    <p class="modal-note">firebase-config.js 파일이 없거나 직접 입력하고 싶을 때 사용하세요. 입력값은 브라우저에만 저장됩니다 (localStorage).</p>
    <div class="modal-field">
      <label>API Key</label>
      <input type="text" id="cfg-apiKey" placeholder="AIzaSy...">
    </div>
    <div class="modal-field">
      <label>Auth Domain</label>
      <input type="text" id="cfg-authDomain" placeholder="project.firebaseapp.com">
    </div>
    <div class="modal-field">
      <label>Database URL</label>
      <input type="text" id="cfg-databaseURL" placeholder="https://project-default-rtdb.firebaseio.com">
    </div>
    <div class="modal-field">
      <label>Project ID</label>
      <input type="text" id="cfg-projectId" placeholder="project-id">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeCfgModal()">취소</button>
      <button class="btn btn-primary" onclick="saveCfgModal()">저장 &amp; 연결</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<div class="app">
  <!-- HEADER -->
  <header>

<script>
/* ═══════════════════════════════════════════════════════════════
   SMART FARM DASHBOARD  —  Main Script

// ── CANVAS BACKGROUND (grid + particles) ──────────────────────
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  const N = 40;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function mkParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 1.5 + 0.5,
      a: Math.random() * 0.6 + 0.2
    };
  }

  function init() {
    resize();
    particles = Array.from({length: N}, mkParticle);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = 'rgba(0,255,136,0.04)';
    ctx.lineWidth = 1;
    const gSize = 60;
    for (let x = 0; x < W; x += gSize) {
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gSize) {
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }

    // particles + connections
    particles.forEach((p, i) => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,255,136,${p.a})`;
      ctx.fill();

      for (let j = i+1; j < particles.length; j++) {
        const q = particles[j];
        const d = Math.hypot(p.x-q.x, p.y-q.y);
        if (d < 140) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = `rgba(0,255,136,${0.12 * (1-d/140)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init(); draw();
})();

// ── CLOCK ─────────────────────────────────────────────────────
setInterval(() => {
  const now = new Date();
  document.getElementById('clock').textContent =

var currentModule = 'module_01';
function switchTab(mod) {
  document.querySelectorAll('.module-view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + mod).classList.add('active');
  const tabMap = { module_01: 'tab-m01', module_02: 'tab-m02' };
  document.getElementById(tabMap[mod]).classList.add('active');
  currentModule = mod;
}

// ── SENSOR META ───────────────────────────────────────────────
const SENSOR_META = {
  temperature:  { label: '온도',    icon: '🌡', unit: '°C',  min: 0,  max: 50,  color: '#ff6633' },
  air_humidity: { label: '습도',    icon: '💧', unit: '%',   min: 0,  max: 100, color: '#00ccff' },
  illuminance:  { label: '조도',    icon: '☀️', unit: 'lux', min: 0,  max: 1000,color: '#ffee55' },
  soil_moisture:{ label: '토양수분', icon: '🌱', unit: '%',   min: 0,  max: 100, color: '#44dd88' },
  water_level:  { label: '수위',    icon: '🪣', unit: '%',   min: 0,  max: 100, color: '#44aaff' },
};

const RULE_ICONS = {
  temperature:  '🌡',
  air_humidity: '💧',
  illuminance:  '☀️',
  soil_moisture:'🌱',
};

// ── BUILD SENSOR CARDS ─────────────────────────────────────────
function buildSensors(modId) {
  const container = document.getElementById('sensors-' + modId);
  container.innerHTML = '';
  Object.entries(SENSOR_META).forEach(([key, meta]) => {
    container.innerHTML += `
      <div class="sensor-card" style="--accent-color:${meta.color}" id="sc-${modId}-${key}">
        <div class="sensor-label">
          <span class="s-icon">${meta.icon}</span>
          ${meta.label}
        </div>
        <div class="sensor-value" id="sv-${modId}-${key}">
          —<span class="unit">${meta.unit}</span>
        </div>
        <div class="sensor-bar"><div class="sensor-bar-fill" id="sb-${modId}-${key}" style="width:0%;background:${meta.color};box-shadow:0 0 6px ${meta.color}40"></div></div>
        <div class="sensor-range">
          <span>${meta.min}${meta.unit}</span>
          <span>${meta.max}${meta.unit}</span>
        </div>
      </div>`;
  });
}

function updateSensorCard(modId, key, val) {
  const meta = SENSOR_META[key];
  if (!meta) return;
  const svEl = document.getElementById(`sv-${modId}-${key}`);
  const sbEl = document.getElementById(`sb-${modId}-${key}`);
  if (svEl) svEl.innerHTML = `${Number(val).toFixed(key==='illuminance'?0:1)}<span class="unit">${meta.unit}</span>`;
  if (sbEl) {
    const pct = Math.min(100, Math.max(0, (val - meta.min) / (meta.max - meta.min) * 100));
    sbEl.style.width = pct + '%';
  }
}

// ── BUILD ACTUATORS ───────────────────────────────────────────
const ACT_META = {
  fan:    { label: '냉각 팬',   icon: '🌀', color: '#00ccff', hasSlider: true,  sliderKey: 'fan_speed' },
  heater: { label: '히터',     icon: '🔥', color: '#ff6633', hasSlider: false },
  led:    { label: 'LED 조명', icon: '💡', color: '#ffee55', hasSlider: true,  sliderKey: 'led_brightness' },
  pump:   { label: '워터 펌프', icon: '💦', color: '#44aaff', hasSlider: false },
};

function buildActuators(modId) {
  const container = document.getElementById('actuators-' + modId);
  container.innerHTML = '';
  Object.entries(ACT_META).forEach(([key, meta]) => {
    const sliderHtml = meta.hasSlider ? `
      <div class="act-slider-wrap">
        <input type="range" class="act-slider" min="0" max="100" value="80"
          id="sl-${modId}-${key}"
          oninput="onSliderInput('${modId}','${key}','${meta.sliderKey}',this.value)"
          onchange="writeSlider('${modId}','${key}','${meta.sliderKey}',this.value)">
        <span class="act-slider-val" id="slv-${modId}-${key}">80</span>
      </div>` : `<div class="act-sub" id="act-sub-${modId}-${key}">—</div>`;

    container.innerHTML += `
      <div class="actuator-row">
        <div class="act-icon" id="ai-${modId}-${key}" style="--act-color:${meta.color}">${meta.icon}</div>
        <div class="act-info">
          <div class="act-name">${meta.label}</div>
          ${meta.hasSlider ? '' : `<div class="act-sub" id="act-sub-${modId}-${key}">—</div>`}
        </div>
        ${sliderHtml}
        <label class="toggle" style="width:44px;height:24px">
          <input type="checkbox" id="act-${modId}-${key}"
            onchange="toggleActuator('${modId}','${key}',this.checked)">
          <div class="toggle-track" style="border-radius:12px"></div>
          <div class="toggle-thumb" style="top:3px;left:3px;width:16px;height:16px"></div>
        </label>
      </div>`;
  });
}

function updateActuator(modId, key, val) {
  const icon = document.getElementById(`ai-${modId}-${key}`);
  const chk  = document.getElementById(`act-${modId}-${key}`);
  const sub  = document.getElementById(`act-sub-${modId}-${key}`);
  if (icon) { if(val) icon.classList.add('active'); else icon.classList.remove('active'); }
  if (chk)  { chk.checked = !!val; }
  if (sub)  { sub.textContent = val ? 'ON' : 'OFF'; }
}

function updateSlider(modId, key, sliderKey, val) {
  const sl  = document.getElementById(`sl-${modId}-${key}`);
  const slv = document.getElementById(`slv-${modId}-${key}`);
  if (sl)  sl.value = val;
  if (slv) slv.textContent = val + '%';
}

// ── BUILD CONTROL RULES ───────────────────────────────────────
const RULE_KEYS = ['temperature','air_humidity','illuminance','soil_moisture'];
const RULE_LABELS = {
  temperature:   { name: '온도', unit: '°C' },
  air_humidity:  { name: '습도', unit: '%'  },
  illuminance:   { name: '조도', unit: 'lux'},
  soil_moisture: { name: '토양수분', unit: '%'},
};

function buildRules(modId) {
  const container = document.getElementById('rules-' + modId);
  container.innerHTML = '';
  RULE_KEYS.forEach(key => {
    const rl = RULE_LABELS[key];
    container.innerHTML += `
      <div class="rule-row" id="rr-${modId}-${key}">
        <div class="rule-header">
          <div class="rule-name">${RULE_ICONS[key]} ${rl.name}</div>
          <label class="rule-enabled-toggle" title="활성화">
            <input type="checkbox" class="rule-chk" id="ren-${modId}-${key}"
              onchange="toggleRule('${modId}','${key}',this.checked)">
            <div class="rule-chk-track"></div>
            <div class="rule-chk-thumb"></div>
          </label>
        </div>
        <div class="rule-inputs">
          <div class="rule-field">
            <label>MIN (${rl.unit})</label>
            <input type="number" id="rmin-${modId}-${key}" placeholder="—">
          </div>
          <div class="rule-field">
            <label>MAX (${rl.unit})</label>
            <input type="number" id="rmax-${modId}-${key}" placeholder="—">
          </div>
          <div class="rule-field">
            <label>Cooldown (s)</label>
            <input type="number" id="rcd-${modId}-${key}" placeholder="—">
          </div>
        </div>
        <button class="rule-save-btn" onclick="saveRule('${modId}','${key}')">저장</button>
      </div>`;
  });
}

function updateRule(modId, key, data) {
  const enEl  = document.getElementById(`ren-${modId}-${key}`);
  const minEl = document.getElementById(`rmin-${modId}-${key}`);
  const maxEl = document.getElementById(`rmax-${modId}-${key}`);
  const cdEl  = document.getElementById(`rcd-${modId}-${key}`);
  if (enEl && data.enabled !== undefined) enEl.checked = data.enabled;
  if (minEl && data.target_min !== undefined) minEl.value = data.target_min;
  if (maxEl && data.target_max !== undefined) maxEl.value = data.target_max;
  if (cdEl  && data.cooldown_sec !== undefined) cdEl.value  = data.cooldown_sec;
}

// ── INIT UI ───────────────────────────────────────────────────
['module_01','module_02'].forEach(mod => {
  buildSensors(mod);
  buildActuators(mod);
  buildRules(mod);
});

// ── FIREBASE ──────────────────────────────────────────────────
var db = null;
var fbRefs = {};

function setFirebaseStatus(state, text) {
  const el = document.getElementById('firebase-status');
  const tx = document.getElementById('firebase-status-text');
  el.className = '';
  el.classList.add(state);
  tx.textContent = text;
}

function initFirebase(config) {
  try {
    if (firebase.apps.length) firebase.app().delete();
  } catch(e) {}
  try {
    firebase.initializeApp(config);
    db = firebase.database();
    subscribeAll();
    setFirebaseStatus('connected', 'CONNECTED');
    showToast('Firebase 연결됨 ✓');
  } catch(e) {
    setFirebaseStatus('error', 'ERROR');
    showToast('Firebase 연결 실패: ' + e.message, true);
  }
}

function subscribeAll() {
  ['module_01','module_02'].forEach(mod => {
    const ref = db.ref('farm/modules/' + mod);
    if (fbRefs[mod]) fbRefs[mod].off();
    fbRefs[mod] = ref;
    ref.on('value', snap => {
      const data = snap.val();
      if (!data) return;
      applyModuleData(mod, data);
    });
  });

  // connection state
  db.ref('.info/connected').on('value', snap => {
    if (snap.val()) {
      setFirebaseStatus('connected', 'CONNECTED');
    } else {
      setFirebaseStatus('error', 'DISCONNECTED');
    }
  });
}

function applyModuleData(mod, data) {
  // meta
  if (data.meta) {
    const nm = data.meta.name || mod;
    document.getElementById(`name-${mod}`).textContent = nm;
    document.getElementById(`fw-${mod}`).textContent = 'fw ' + (data.meta.fw_version || '—');
    const stEl = document.getElementById(`status-${mod}`);
    const online = data.meta.status === 'online';
    stEl.textContent = online ? 'ONLINE' : 'OFFLINE';
    stEl.className = 'module-status-badge ' + (online ? 'online' : 'offline');
    const dotEl = document.getElementById(`tab-dot-${mod}`);
    if (dotEl) { dotEl.className = 'tab-status' + (online ? ' online' : ''); }
  }

  // sensors
  if (data.sensors) {
    Object.entries(data.sensors).forEach(([k, v]) => {
      if (k === 'updated_at') {
        const updEl = document.getElementById(`upd-${mod}`);
        if (updEl && v) {
          const d = new Date(v * 1000);
          updEl.textContent = 'updated ' + d.toLocaleTimeString('ko-KR',{hour12:false});
        }
        return;
      }
      updateSensorCard(mod, k, v);
    });
  }

  // auto_mode
  const autoChk = document.getElementById(`auto-${mod}`);
  const autoState = document.getElementById(`auto-state-${mod}`);
  if (autoChk && data.auto_mode !== undefined) {
    autoChk.checked = data.auto_mode;
    autoState.textContent = data.auto_mode ? 'AUTO' : 'MANUAL';
    autoState.className = 'toggle-state' + (data.auto_mode ? ' on' : '');
  }

  // actuators
  if (data.actuators) {
    const acts = data.actuators;
    ['fan','heater','led','pump'].forEach(key => {
      if (acts[key] !== undefined) updateActuator(mod, key, acts[key]);
    });
    if (acts.fan_speed !== undefined) updateSlider(mod, 'fan', 'fan_speed', acts.fan_speed);
    if (acts.led_brightness !== undefined) updateSlider(mod, 'led', 'led_brightness', acts.led_brightness);
  }

  // control_rules
  if (data.control_rules) {
    Object.entries(data.control_rules).forEach(([key, val]) => {
      updateRule(mod, key, val);
    });
  }
}

// ── WRITE HELPERS ─────────────────────────────────────────────
function writeDB(path, value) {
  if (!db) { showToast('Firebase 미연결', true); return Promise.reject(); }
  return db.ref(path).set(value);
}

function toggleAuto(mod, val) {
  writeDB(`farm/modules/${mod}/auto_mode`, val);
  const stEl = document.getElementById(`auto-state-${mod}`);
  stEl.textContent = val ? 'AUTO' : 'MANUAL';
  stEl.className = 'toggle-state' + (val ? ' on' : '');
}

function toggleActuator(mod, key, val) {
  // optimistic
  updateActuator(mod, key, val);
  writeDB(`farm/modules/${mod}/actuators/${key}`, val)
    .catch(() => { updateActuator(mod, key, !val); showToast('쓰기 실패', true); });
}

function onSliderInput(mod, key, sliderKey, val) {
  const slv = document.getElementById(`slv-${mod}-${key}`);
  if (slv) slv.textContent = val + '%';
}

function writeSlider(mod, key, sliderKey, val) {
  writeDB(`farm/modules/${mod}/actuators/${sliderKey}`, Number(val));
}

function toggleRule(mod, key, val) {
  writeDB(`farm/modules/${mod}/control_rules/${key}/enabled`, val)
    .catch(() => showToast('쓰기 실패', true));
}

function saveRule(mod, key) {
  const minV = Number(document.getElementById(`rmin-${mod}-${key}`).value);
  const maxV = Number(document.getElementById(`rmax-${mod}-${key}`).value);
  const cdV  = Number(document.getElementById(`rcd-${mod}-${key}`).value);
  const en   = document.getElementById(`ren-${mod}-${key}`).checked;

  if (minV >= maxV) { showToast('MIN < MAX 조건 확인!', true); return; }

  writeDB(`farm/modules/${mod}/control_rules/${key}`, {
    enabled: en,
    target_min: minV,
    target_max: maxV,
    cooldown_sec: cdV
  }).then(() => showToast(`[${key}] 규칙 저장됨 ✓`))
    .catch(() => showToast('저장 실패', true));
}

// ── CONFIG MODAL ──────────────────────────────────────────────
function openCfgModal() {
  // pre-fill from localStorage
  const saved = getSavedConfig();
  if (saved) {
    ['apiKey','authDomain','databaseURL','projectId'].forEach(k => {
      const el = document.getElementById('cfg-' + k);
      if (el && saved[k]) el.value = saved[k];
    });
  }
  document.getElementById('cfg-modal').classList.add('open');
}

function closeCfgModal() {
  document.getElementById('cfg-modal').classList.remove('open');
}

function saveCfgModal() {
  const cfg = {
    apiKey:      document.getElementById('cfg-apiKey').value.trim(),
    authDomain:  document.getElementById('cfg-authDomain').value.trim(),
    databaseURL: document.getElementById('cfg-databaseURL').value.trim(),
    projectId:   document.getElementById('cfg-projectId').value.trim(),
  };
  if (!cfg.apiKey || !cfg.databaseURL) { showToast('필수 항목을 입력하세요', true); return; }
  localStorage.setItem('fb_cfg', JSON.stringify(cfg));
  closeCfgModal();
  initFirebase(cfg);
}

function getSavedConfig() {
  try { return JSON.parse(localStorage.getItem('fb_cfg')); } catch(e) { return null; }
}

// ── TOAST ─────────────────────────────────────────────────────
var toastTimer;
function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isErr ? 'var(--danger)' : 'var(--accent2)';
  t.style.color = isErr ? 'var(--danger)' : 'var(--accent)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── BOOT ──────────────────────────────────────────────────────
(function boot() {
  setFirebaseStatus('', '연결 대기');

  // Priority 1: firebase-config.js 에서 FIREBASE_CONFIG
  if (typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
    initFirebase(FIREBASE_CONFIG);
    return;
  }

  // Priority 2: localStorage
  const saved = getSavedConfig();
  if (saved && saved.apiKey) {
    initFirebase(saved);
    return;
  }

  // Priority 3: 설정 모달 안내
  setFirebaseStatus('error', '미설정');
  setTimeout(() => openCfgModal(), 400);
})();
</script>
