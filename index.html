<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AreYouIoT — Smart Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- LOGIN -->
<div class="modal-overlay" id="login-modal">
  <form class="modal" id="login-form" autocomplete="on">
    <div class="modal-title">🔐 로그인</div>
    <p class="modal-note">등록된 계정만 제어판에 접근할 수 있습니다.</p>
    <div class="modal-field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="username" required>
    </div>
    <div class="modal-field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </div>
    <div class="modal-error" id="login-error"></div>
    <div class="modal-actions">
      <button type="submit" class="btn btn-primary" id="login-btn">로그인</button>
    </div>
  </form>
</div>

<!-- TOAST -->
<div id="toast" role="status" aria-live="polite"></div>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <div class="logo-text">
        <strong>AreYouIoT</strong>
        Smart Farm Control Panel
      </div>
    </div>
    <div class="header-status">
      <div id="firebase-status">
        <span class="dot"></span>
        <span id="firebase-status-text">연결 대기</span>
      </div>
      <div class="ts-badge" id="clock">--:--:--</div>
      <div class="user-box" id="user-box" hidden>
        <span class="user-email" id="user-email"></span>
        <button class="cfg-btn" id="logout-btn" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <nav class="module-tabs" id="module-tabs"></nav>

  <main id="module-views">
    <div class="not-configured" id="empty-state">
      <div class="big">🌱</div>
      <div id="empty-text">인증 확인 중...</div>
    </div>
  </main>
</div>

<!-- 모듈 1개 화면 템플릿: 모듈 수만큼 JS가 복제해서 사용 -->
<template id="tpl-module">
  <section class="module-view scan-wrap">
    <div class="scanline"></div>
    <div class="module-header">
      <span class="module-name" data-role="name"></span>
      <span class="module-status-badge offline" data-role="status">OFFLINE</span>
      <span class="module-fw" data-role="fw">fw —</span>
      <span class="module-updated" data-role="updated">updated —</span>
    </div>

    <div class="top-row">
      <div class="sensors-grid" data-role="sensors"></div>
      <div class="auto-panel">
        <div class="auto-label">AUTO<br>MODE</div>
        <div class="toggle-wrap">
          <label class="toggle">
            <input type="checkbox" data-role="auto-chk" aria-label="자동 모드">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
          <div class="toggle-state" data-role="auto-state">—</div>
        </div>
      </div>
    </div>

    <div class="bottom-grid">
      <div class="col">
        <div class="panel act-panel">
          <div class="panel-title">actuators</div>
          <div class="lock-note">🔒 AUTO 모드 — 수동 제어가 잠겨 있습니다</div>
          <div data-role="actuators"></div>
        </div>

        <div class="panel tank-panel">
          <div class="panel-title">water tank · ultrasonic</div>
          <div class="rule-inputs two">
            <div class="rule-field">
              <label>빈 탱크 거리 (cm)</label>
              <input type="number" step="0.1" min="0" data-role="tank-empty" placeholder="—">
            </div>
            <div class="rule-field">
              <label>가득 찬 거리 (cm)</label>
              <input type="number" step="0.1" min="0" data-role="tank-full" placeholder="—">
            </div>
          </div>
          <p class="panel-note">초음파 센서에서 수면까지의 거리입니다. 탱크가 비었을 때 값이 더 큽니다. 수위(%)는 이 두 값으로 계산됩니다.</p>
          <button class="rule-save-btn" type="button" data-role="tank-save">저장</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">control rules</div>
        <div class="rules-grid" data-role="rules"></div>
      </div>

    </div>
  </section>
</template>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/schema.js"></script>
<script src="js/background.js"></script>
<script src="js/app.js"></script>
</body>
</html>
